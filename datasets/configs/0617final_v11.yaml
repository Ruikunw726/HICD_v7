# Class weights (inverse log frequency balancing)
pixel_class_weights:
- 0.063   # 0 Farmland (224M px)
- 0.796   # 1 Runway (13M)
- 0.933   # 2 Taxiway (11M)
- 0.597   # 3 Apron (17M)
- 2.820   # 4 Bridge (97K)
- 1.104   # 5 Highway (9.4M)
- 0.069   # 6 Building (159M)
- 4.310   # 7 Shelter (241K)
- 0.000   # 8 Tower [IGNORED - mapped to 255]
- 2.820   # 9 Pier (372K)
- 1.562   # 10 Dock (670K)
- 1.054   # 11 Tank (990K)
- 7.220   # 12 Aircraft (584K)
- 5.470   # 13 Vessel (1.9M)
- 1.800   # 14 Crater (584K)
- 0.050   # 15 Background (low weight to avoid dominating)
state_pixel_weights:
- 0.2     # 0 no-change
- 3.0     # 1 damaged
- 4.0     # 2 reduced
- 5.0     # 3 added
- 5.0     # 4 extended
- 4.0     # 5 replaced
- 0.0     # 6 none (background, ignored in loss)
branch_routing:
  instance:
  - Building
  semantic: *id001
active_heads:
  instance_detection: true
  change_type: false
  damage_level: false
  pixel_target: true
  pixel_state: true
train_split: train
val_split: val
test_split: test
w_state_pixel: 2.0  # Boost state loss weight
state_ignore_targets:
  - 0  # Farmland (always no-change, not informative)
  # Tower removed - now mapped to 255 (ignore)


# Frequency branch configuration
frequency_branch:
  enabled: true
  out_dim: 64
  levels: 2  # Number of DWT decomposition levels
